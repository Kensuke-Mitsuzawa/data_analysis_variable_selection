[project]
name = "data_analysis_variable_selection"
version = "0.1"
description = "Data Analysis Variable Selection"
readme = "README.md"
authors = [
    { name = "Kensuke Mitsuzawa", email = "kensuke.mit@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "datasets>=2.14.0",
    "duckdb>=1.4.5",
    "mmd-tst-variable-detector",
    "openpyxl>=3.1.5",
    "sentence-transformers>=5.1.2",
    "transformers<4.48.0",
    "typer>=0.23.2",
    "vec2text>=0.0.13",
]

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pytest",
    "pytest-resource-path>=1.4.1",
    "typeguard>=4.4.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_analysis_variable_selection*"]

[tool.setuptools.package-data]
data_analysis_variable_selection = ["export/template_report/base_report.md"]

[tool.uv.sources]
mmd-tst-variable-detector = { git = "https://github.com/Kensuke-Mitsuzawa/mmd-two-sample-test-variable-selection", rev = "1.6.2" }
